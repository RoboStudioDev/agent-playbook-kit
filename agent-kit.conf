# agent-kit.conf — the ONE file you edit to fit the kit to your projects.
#
# Every script reads it (through scripts/_agent-common.sh), and sync-playbook.sh
# fills the Playbook's team and repo tables from it, so the rules your agents
# read always match what the scripts enforce.
#
# It is plain bash: NAME=value with no spaces around "=", lists in ( ).
# Lines starting with # are notes. Nothing in here is secret: keys and .env
# files go in the secrets/ folder, never here.

# ── 1. Switch the kit on ─────────────────────────────────────────────────────
# The scripts refuse to run while this says "no", so nothing ever runs against
# the example values below. Change it to yes once you've filled this file in.
KIT_CONFIGURED=no

# ── 2. Who approves releases ─────────────────────────────────────────────────
# Shown in the scripts' messages ("ship after the owner approves"). Your first
# name works too.
OWNER_NAME="the owner"

# ── 3. Where things live ─────────────────────────────────────────────────────
# WORKSPACE holds your repos, one folder each. The shared folder of each repo
# only ever follows main; agents never edit it.
WORKSPACE="$HOME/Developer"
# Agents' own copies, made by worktree.sh: $WORKTREES/<Folder>/<agent>-<topic>
WORKTREES="$WORKSPACE/_worktrees"
# This kit's own folder (put it beside your repos, e.g. $WORKSPACE/_ops) also
# keeps, outside every repo and ignored by git:
#   handoffs/  handoff notes, preview and ship records
#   locks/     the ship locks
#   secrets/   each repo's .env file (see REPOS below)
# Uncomment to keep them somewhere else:
# HANDOFFS="$HOME/agent-ops/handoffs"
# LOCKS="$HOME/agent-ops/locks"
# SECRETS="$HOME/agent-ops/secrets"

# ── 4. Your repos ────────────────────────────────────────────────────────────
# One line per repo:
#   "<GitHub repo name>|<folder in WORKSPACE>|<hosting project id>|<live site URL>|<.env file in secrets/, or blank>"
# The release branch must be called main.
REPOS=(
  "web-app|WebApp|your-hosting-project-id|https://app.example.com|web-app.env"
  "marketing-site|MarketingSite|your-other-project-id|https://www.example.com|"
)

# ── 5. Your agents ───────────────────────────────────────────────────────────
# One line per agent:
#   "<name>|<app>|<signs as>|<trial>"
# name      lowercase; starts every branch the agent makes: <name>/<topic>
# app       the app it runs in. Each app gets ONE preview link, named after it,
#           so the owner has one bookmark per app.
# signs as  the <who> in its commit sign-off (section 6). Leave blank for the
#           house agent: it is the git author, so it signs nothing.
# trial     write "trial" for agents you're still trying out: ship.sh checks
#           their commits harder (no deleted files, no gutted docs).
# Any agent may take any task; the app only decides the preview link.
AGENTS=(
  "opus|claude||"
  "claude|claude||"
  "sonnet|claude|sonnet|"
  "codex|codex|codex|"
  "gemini|antigravity|gemini|trial"
  "grok|cursor|grok|trial"
  "nemotron|conductor|nemotron|trial"
  "gemma|local|gemma|trial"
)

# Apps that make their own copies in a known place, so the app is known from
# the folder no matter what the branch is called: "<folder pattern>|<app>".
LANE_PATHS=(
  "$HOME/conductor/*|conductor"
  "*/.claude/worktrees/*|claude"
)

# ── 6. Commit sign-offs ──────────────────────────────────────────────────────
# Every agent except the house agent ends each commit message with:
#   Co-Authored-By: <signs as>-<SIGN_TAG>[bot] <SIGN_EMAIL>
# e.g. "Co-Authored-By: codex-studio[bot] <agents@example.com>".
# Use an address you control (or a GitHub noreply address), never a person's.
SIGN_TAG=studio
SIGN_EMAIL=agents@example.com

# ── 7. Building and hosting ──────────────────────────────────────────────────
# The build must write a static site to BUILD_DIR, whose index.html loads one
# hashed main script (Vite's default: index-<hash>.js). ship.sh compares that
# file name on the live site with its own build to prove the release is live.
BUILD_CMD="npm run build"
BUILD_DIR=dist
BUNDLE_PATTERN='index-[A-Za-z0-9_-]*\.js'
# How long a preview link stays up after its last preview.
PREVIEW_DAYS=30
# Which scripts/host-<name>.sh does the deploying. Firebase Hosting comes with
# the kit; for another host, copy host-firebase.sh and change its 3 functions.
HOST_ADAPTER=firebase
